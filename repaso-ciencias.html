<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El ecosistema — Repaso de Ciencias Naturales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1630;
  --ink-2:#152244;
  --tile-1:#9BE564;   /* hoja */
  --tile-2:#34D1E0;   /* agua */
  --tile-3:#A78BFA;   /* microscopio */
  --tile-4:#FFC857;   /* sol */
  --tile-5:#FF7A6B;   /* coral */
  --paper:#FBFDFF;
  --grout:rgba(255,255,255,.10);
  --ok:#4BE3A2;
  --no:#FF6B7D;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 8% -10%, #1C3A6B 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #14514F 0%, transparent 55%),
    var(--ink);
  color:var(--paper);font-family:var(--body);min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.badge{width:52px;height:52px;flex:0 0 52px;border-radius:14px;
  background:linear-gradient(135deg,var(--tile-1),var(--tile-2));
  display:grid;place-items:center;font-size:26px;transform:rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.28)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,32px);margin:0;line-height:1.05}
.sub{opacity:.75;font-size:14px;margin:2px 0 0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:22px}
.tile{position:relative;border:0;cursor:pointer;text-align:left;color:var(--paper);
  background:var(--ink-2);border-radius:16px;padding:14px;min-height:118px;font-family:var(--body);
  box-shadow:inset 0 0 0 2px var(--grout);transition:transform .15s ease;
  display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{transform:translateY(-3px)}
.tile:focus-visible{outline:3px solid var(--tile-4);outline-offset:3px}
.tile .em{font-size:24px;line-height:1}
.tile .tt{font-family:var(--display);font-weight:600;font-size:16px;margin:8px 0 0;line-height:1.15}
.tile .pg{font-size:11px;opacity:.6;margin-top:2px}
.tile .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden}
.tile .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .5s ease}
.tile .score{position:absolute;top:10px;right:12px;font-family:var(--display);font-size:13px}
.tile[data-done="1"]{background:linear-gradient(150deg,var(--c) 0%, color-mix(in srgb, var(--c) 55%, var(--ink-2)) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 6px 0 rgba(0,0,0,.22)}
.tile[data-done="1"] .tt,.tile[data-done="1"] .em,.tile[data-done="1"] .score{color:#0C1630}
.tile[data-done="1"] .pg{color:#0C1630;opacity:.7}
.final{margin-top:14px;width:100%;border:0;cursor:pointer;border-radius:18px;padding:16px;
  background:linear-gradient(120deg,var(--tile-1),var(--tile-2));color:#052a2e;
  font-family:var(--display);font-weight:700;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.final small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
.card{background:rgba(255,255,255,.06);border-radius:20px;padding:18px;box-shadow:inset 0 0 0 2px var(--grout)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.back{background:none;border:0;color:var(--paper);opacity:.75;font-family:var(--body);font-size:14px;cursor:pointer;padding:6px 0}
.back:hover{opacity:1}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.2)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--no)} .dots i.now{background:var(--tile-4);transform:scale(1.25)}
.qtxt{font-family:var(--display);font-weight:600;font-size:clamp(19px,4.4vw,26px);line-height:1.25;margin:4px 0}
.qhint{font-size:14px;opacity:.72;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{border:0;cursor:pointer;text-align:left;font-family:var(--body);font-size:17px;background:var(--paper);color:var(--ink);
  border-radius:14px;padding:14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .1s ease}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.opt:focus-visible{outline:3px solid var(--tile-4);outline-offset:3px}
.opt.ok{background:var(--ok);color:#052a18}
.opt.no{background:var(--no);color:#3a0512}
.opt[disabled]{cursor:default;transform:none}
.opt.dim{opacity:.45}
.typebox{display:flex;gap:10px;flex-wrap:wrap}
.typebox input{flex:1 1 200px;font-family:var(--body);font-size:19px;padding:14px 16px;border-radius:14px;border:0;
  background:var(--paper);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.typebox input:focus-visible{outline:3px solid var(--tile-4);outline-offset:2px}
.btn{border:0;cursor:pointer;border-radius:14px;padding:14px 22px;font-family:var(--display);font-weight:600;font-size:17px;
  background:var(--tile-2);color:#04302b;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.alt{background:var(--tile-3);color:#150a33}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid var(--tile-4);outline-offset:3px}
.fb{margin-top:14px;border-radius:14px;padding:13px 15px;font-size:15px;display:none;line-height:1.45}
.fb.show{display:block;animation:pop .25s ease}
.fb.good{background:rgba(75,227,162,.16);box-shadow:inset 0 0 0 2px rgba(75,227,162,.5)}
.fb.bad{background:rgba(255,107,125,.14);box-shadow:inset 0 0 0 2px rgba(255,107,125,.5)}
.fb b{font-family:var(--display)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.shake{animation:shake .3s}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{text-align:center;padding:26px 18px}
.bigscore{font-family:var(--display);font-size:64px;line-height:1;margin:6px 0}
.stars{font-size:30px;letter-spacing:6px;margin:6px 0 2px}
.rmsg{font-size:17px;opacity:.9;margin:8px auto 0;max-width:460px}
.hidden{display:none}
footer{opacity:.45;font-size:12px;text-align:center;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="badge">🔬</div>
    <div>
      <h1>El ecosistema</h1>
      <p class="sub">Repaso para el examen de Ciencias · jueves 6 de agosto</p>
    </div>
  </header>

  <section id="home">
    <p class="sub" style="margin:18px 0 0">Cada tarjeta es un tema del examen. Con 80 o más, el tema queda dominado.</p>
    <div class="board" id="board"></div>
    <button class="final" id="btnFinal">Evaluación general
      <small>20 preguntas mezcladas de todos los temas</small>
    </button>
    <p class="sub" id="globalNote" style="margin-top:16px"></p>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qhead">
        <button class="back" id="btnBack">← Volver al inicio</button>
        <div class="dots" id="dots"></div>
      </div>
      <p class="qhint" id="qtopic"></p>
      <h2 class="qtxt" id="qtxt"></h2>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <div class="row hidden" id="nextRow"><button class="btn" id="btnNext">Siguiente →</button></div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="card result">
      <div class="stars" id="rstars"></div>
      <div class="bigscore" id="rscore"></div>
      <p class="rmsg" id="rmsg"></p>
      <div class="row" style="justify-content:center">
        <button class="btn alt hidden" id="btnRetryWrong">Repasar los fallos</button>
        <button class="btn" id="btnHome">Volver al inicio</button>
      </div>
    </div>
  </section>

  <footer>Hecho con las páginas 112–122 del libro de Ciencias · Santillana</footer>
</div>

<script>
const T = [
{ id:"bioticos", em:"🍄", name:"Factores bióticos", pg:"pág. 112", c:"var(--tile-1)", q:[
  {t:"mc",q:"¿Qué son los factores BIÓTICOS?",o:["Los seres vivos que hacen parte del ambiente","Las cosas sin vida del ambiente","Solo los animales grandes"],a:0,tip:"Bióticos = con vida. Incluyen microorganismos, hongos, plantas y animales."},
  {t:"mc",q:"¿Cuáles son los cuatro grupos de factores bióticos?",o:["Microorganismos, hongos, plantas y animales","Agua, aire, suelo y luz","Peces, aves, reptiles y mamíferos"],a:0},
  {t:"mc",q:"Los MICROORGANISMOS son…",o:["seres muy diminutos que no se pueden observar a simple vista","animales pequeños como las hormigas","plantas sin flores"],a:0,tip:"En este grupo están las bacterias y los protistas."},
  {t:"mc",q:"¿Qué seres pertenecen al grupo de los microorganismos?",o:["Las bacterias y los protistas","Los hongos y los musgos","Los insectos"],a:0},
  {t:"mc",q:"Los HONGOS, a diferencia de las plantas…",o:["no elaboran su propio alimento","se desplazan de un lugar a otro","viven solo en el agua"],a:0,tip:"Los hongos se alimentan de los restos de otros seres vivos."},
  {t:"mc",q:"¿De qué se alimentan los hongos?",o:["De los restos de otros seres vivos","De la luz del Sol","De agua salada"],a:0},
  {t:"mc",q:"¿Los hongos se desplazan?",o:["No, igual que las plantas","Sí, como los animales","Solo de noche"],a:0},
  {t:"mc",q:"Las PLANTAS elaboran su alimento gracias a…",o:["la energía del Sol","los restos de otros seres","el oxígeno del aire"],a:0},
  {t:"mc",q:"¿Todas las plantas viven sujetas al suelo?",o:["Casi todas, aunque algunas son acuáticas","Sí, todas sin excepción","No, muchas se desplazan"],a:0},
  {t:"mc",q:"Los ANIMALES son seres vivos con la capacidad de…",o:["moverse de un lugar a otro","elaborar su propio alimento","vivir sin oxígeno"],a:0},
  {t:"mc",q:"¿De qué se alimentan los animales?",o:["De otros seres, como las plantas u otros animales","Solo de la luz del Sol","De agua y minerales del suelo"],a:0},
  {t:"esc",q:"Los seres vivos del ambiente se llaman factores…",a:["bioticos","bióticos"]},
  {t:"mc",q:"De estos seres vivos, ¿cuál se encuentra únicamente en el AGUA?",o:["El pez payaso","La rana","El pájaro"],a:0,tip:"La rana vive en el agua cuando es joven y también en tierra firme."},
  {t:"mc",q:"¿Cuál de estos NO es un factor biótico?",o:["El agua","Un hongo","Una bacteria"],a:0}
]},

{ id:"abioticos", em:"☀️", name:"Factores abióticos", pg:"pág. 113", c:"var(--tile-4)", q:[
  {t:"mc",q:"¿Qué son los factores ABIÓTICOS?",o:["Los elementos sin vida del ambiente, como el agua, el aire, el suelo y la luz del Sol","Los seres vivos del ambiente","Solo las plantas y los hongos"],a:0},
  {t:"mc",q:"¿Por qué los factores bióticos necesitan de los abióticos?",o:["Porque dependen de ellos para crecer y desarrollarse","Porque se alimentan de ellos únicamente","Porque no tienen relación entre sí"],a:0},
  {t:"mc",q:"Las serpientes, los lagartos y las tortugas necesitan…",o:["el calor del sol para mantenerse calientes","el suelo para elaborar su alimento","la sal del mar"],a:0},
  {t:"mc",q:"Las plantas necesitan tres factores abióticos para elaborar su alimento:",o:["la energía del sol, el agua y el suelo","el aire, la sal y el fuego","el calor, la presión y la sal"],a:0},
  {t:"mc",q:"Los animales terrestres necesitan el agua para…",o:["hidratarse y realizar sus funciones vitales","elaborar su alimento","construir refugios"],a:0},
  {t:"mc",q:"¿Qué toman los animales del aire?",o:["El oxígeno que necesitan para respirar","El dióxido de carbono","La luz del Sol"],a:0},
  {t:"mc",q:"¿Qué toman las plantas del aire?",o:["El dióxido de carbono para elaborar su alimento","El oxígeno para respirar","El nitrógeno del suelo"],a:0},
  {t:"mc",q:"El agua es el ambiente en el que viven toda su vida…",o:["los peces","las hormigas","los conejos"],a:0,tip:"Los anfibios viven en el agua solo cuando son jóvenes."},
  {t:"mc",q:"¿Qué animales construyen sus refugios en el SUELO?",o:["Las hormigas y los conejos","Los peces y los delfines","Las aves y los murciélagos"],a:0},
  {t:"mc",q:"El agua ayuda a los seres vivos a permanecer…",o:["hidratados","calientes","dormidos"],a:0},
  {t:"mc",q:"¿Cuál de estos SÍ es un factor abiótico?",o:["La luz solar","Una lombriz","Un hongo"],a:0},
  {t:"mc",q:"¿Cuál de estas necesidades NO tiene una planta?",o:["Alimentos de origen animal","Agua","Luz solar"],a:0,tip:"La planta elabora su propio alimento; no come otros seres."},
  {t:"mc",q:"Un león necesita del ambiente…",o:["agua, aire y alimentos de origen animal","solo luz solar","solo suelo y agua"],a:0}
]},

{ id:"terrestres", em:"🦅", name:"Adaptaciones terrestres", pg:"págs. 116–117", c:"var(--tile-5)", q:[
  {t:"mc",q:"¿Qué factores determinan las condiciones de los ambientes terrestres?",o:["La temperatura, la humedad del aire y la disponibilidad de luz","La presión y la salinidad","Solo la lluvia"],a:0},
  {t:"mc",q:"Los animales responden a esas condiciones mediante…",o:["su comportamiento, el funcionamiento de su cuerpo o características físicas como el pelaje","solo el color de sus ojos","solo su tamaño"],a:0},
  {t:"mc",q:"Los animales que viven BAJO TIERRA tienen…",o:["garras especiales que usan a modo de pala para cavar","alas grandes","aletas en forma de remo"],a:0},
  {t:"mc",q:"Como las madrigueras son oscuras, esos animales…",o:["desarrollan otros sentidos diferentes a la vista, con ayuda de los bigotes","ven mejor que los demás","no necesitan sentidos"],a:0},
  {t:"mc",q:"¿Por qué los animales de las sabanas tienen adaptaciones para CORRER?",o:["Porque en las zonas abiertas no hay muchos sitios donde esconderse y deben huir","Porque les gusta jugar","Porque persiguen a las plantas"],a:0},
  {t:"mc",q:"Los animales que viven en los ÁRBOLES tienen…",o:["cuerpos pequeños y fuertes, con dedos oponibles para agarrar objetos","cuerpos grandes y pesados","aletas y branquias"],a:0},
  {t:"mc",q:"¿Qué otra adaptación tienen algunos animales para trepar superficies lisas?",o:["Almohadillas adhesivas","Plumas impermeables","Capas de grasa"],a:0},
  {t:"mc",q:"¿Qué animales se agarran de los árboles usando la cola?",o:["Los camaleones y los monos","Los topos y los conejos","Las ballenas y los delfines"],a:0},
  {t:"mc",q:"Los animales que VUELAN…",o:["permanecen tiempos prolongados en el aire y recorren grandes distancias","saltan de sitios altos y caen enseguida","solo caminan rápido"],a:0},
  {t:"mc",q:"¿Cuántas alas tiene la mayoría de los insectos?",o:["Cuatro","Dos","Seis"],a:0,tip:"Los murciélagos y las aves tienen dos alas."},
  {t:"mc",q:"Los animales que PLANEAN…",o:["no permanecen mucho tiempo en el aire; saltan de sitios altos y recorren una distancia corta","vuelan durante horas","nadan bajo el agua"],a:0},
  {t:"mc",q:"Ejemplos de animales que planean:",o:["Las ardillas voladoras y los peces voladores","Las águilas y los colibríes","Los topos y las lombrices"],a:0},
  {t:"mc",q:"El CAMUFLAJE es una adaptación para…",o:["la defensa: confundirse con el ambiente","volar más rápido","cavar mejor"],a:0},
  {t:"mc",q:"Cuando un animal tiene colores muy llamativos, generalmente…",o:["advierte que tiene venenos o toxinas","quiere que lo vean sus amigos","está enfermo"],a:0},
  {t:"mc",q:"Los insectos palo y las polillas se defienden…",o:["imitando objetos que no son interesantes","corriendo muy rápido","volando muy alto"],a:0}
]},

{ id:"acuaticos", em:"🐬", name:"Adaptaciones acuáticas", pg:"pág. 118", c:"var(--tile-2)", q:[
  {t:"mc",q:"En los ambientes acuáticos, los animales se adaptan a…",o:["la temperatura, la presión, la disponibilidad de luz y la salinidad","la humedad del aire y el pelaje","el viento y la lluvia"],a:0},
  {t:"mc",q:"¿Cómo son los cuerpos de los animales que NADAN?",o:["Alargados o aplanados, para poder avanzar en el agua","Redondos y pesados","Pequeños y con garras"],a:0},
  {t:"mc",q:"La mayoría de los animales que nadan tienen…",o:["aletas en forma de remos, como la tortuga o el tiburón","garras a modo de pala","alas de cuatro partes"],a:0},
  {t:"mc",q:"¿Cómo se adaptan las ballenas a las aguas muy frías?",o:["Acumulan una gruesa capa de grasa bajo la piel","Se cubren de plumas","Salen del agua todos los días"],a:0},
  {t:"mc",q:"¿Qué necesitan TODOS los animales para vivir?",o:["Oxígeno","Sal","Luz de la luna"],a:0},
  {t:"mc",q:"¿De dónde obtienen el oxígeno los peces y los invertebrados?",o:["Del agua","Del aire, saliendo a la superficie","Del suelo"],a:0},
  {t:"mc",q:"Las tortugas, las ballenas y los delfines…",o:["deben salir a la superficie cada cierto tiempo para respirar","obtienen el oxígeno del agua","no necesitan respirar"],a:0},
  {t:"mc",q:"¿Por qué algunos animales pueden pasar varias horas bajo el agua?",o:["Porque tienen pulmones muy grandes","Porque no necesitan oxígeno","Porque nadan muy despacio"],a:0},
  {t:"mc",q:"La SALINIDAD es un factor importante para…",o:["los animales marinos","los animales del desierto","las aves que vuelan"],a:0},
  {t:"mc",q:"El delfín vive en un ambiente…",o:["acuático, y se desplaza nadando","terrestre, y se desplaza caminando","aéreo, y se desplaza volando"],a:0},
  {t:"mc",q:"El cocodrilo vive…",o:["en tierra y en agua; nada y camina","solo en el agua","solo en los árboles"],a:0},
  {t:"mc",q:"La lombriz vive en un ambiente terrestre y se desplaza…",o:["reptando","volando","nadando"],a:0}
]},

{ id:"interacciones", em:"🐝", name:"Las interacciones", pg:"pág. 119", c:"var(--tile-3)", q:[
  {t:"mc",q:"¿Qué son las interacciones?",o:["Las relaciones de los seres vivos con su ambiente y con los demás organismos","Los movimientos de los animales","Las partes del cuerpo de un ser vivo"],a:0},
  {t:"mc",q:"El MUTUALISMO es la interacción en la que…",o:["dos organismos diferentes se benefician mutuamente","uno gana y el otro pierde","dos organismos pelean"],a:0,tip:"Ejemplo: la abeja obtiene alimento de la flor y a la vez ayuda a la planta a reproducirse."},
  {t:"mc",q:"El COMENSALISMO es la interacción en la que…",o:["uno se beneficia y el otro no se beneficia pero tampoco se perjudica","los dos se benefician","los dos se perjudican"],a:0,tip:"Ejemplo: las rémoras usan peces más grandes para viajar sin hacerles daño."},
  {t:"mc",q:"La COMPETENCIA ocurre cuando…",o:["dos o más organismos se enfrentan por pareja, alimento o espacio","un organismo se come a otro","dos organismos se ayudan"],a:0},
  {t:"mc",q:"La PREDACIÓN es la interacción en la que…",o:["un organismo captura y se alimenta de otro","los dos se benefician","uno vive dentro del otro"],a:0},
  {t:"mc",q:"El PARASITISMO es la interacción en la que…",o:["el parásito obtiene beneficios del hospedero, que se ve perjudicado","los dos ganan","ninguno gana ni pierde"],a:0},
  {t:"mc",q:"La abeja y la flor son un ejemplo de…",o:["mutualismo","parasitismo","predación"],a:0},
  {t:"mc",q:"Las rémoras que viajan pegadas a peces más grandes son un ejemplo de…",o:["comensalismo","competencia","mutualismo"],a:0},
  {t:"mc",q:"Dos gallos que se enfrentan para conseguir pareja son un ejemplo de…",o:["competencia","mutualismo","comensalismo"],a:0},
  {t:"mc",q:"Los felinos que se alimentan de otros organismos son un ejemplo de…",o:["predación","parasitismo","comensalismo"],a:0},
  {t:"mc",q:"Los zancudos que transmiten protozoos son un ejemplo de…",o:["parasitismo","mutualismo","competencia"],a:0},
  {t:"mc",q:"Un león que caza una cebra: ¿qué tipo de interacción es?",o:["Predación","Mutualismo","Comensalismo"],a:0},
  {t:"esc",q:"En esa escena, ¿qué animal es el PREDADOR?",a:["leon","león","el leon"]},
  {t:"esc",q:"En esa escena, ¿qué animal es la PRESA?",a:["cebra","la cebra"]},
  {t:"mc",q:"Valentina se llevó dos loros de Petén a su casa en San Marcos. ¿Qué pasará?",o:["Posiblemente mueran porque se van a ver afectados por el cambio de temperatura","Van a sobrevivir porque el clima es igual","No les pasará nada"],a:0,tip:"Cada ser vivo está adaptado a las condiciones de su ambiente natural."}
]},

{ id:"plantas", em:"🌱", name:"Las plantas y sus partes", pg:"pág. 122", c:"var(--tile-1)", q:[
  {t:"mc",q:"Las plantas son organismos AUTÓTROFOS, es decir…",o:["elaboran su propio alimento","se alimentan de otros seres vivos","no necesitan alimento"],a:0},
  {t:"mc",q:"¿De dónde obtienen las plantas el agua y los minerales?",o:["Del suelo","Del aire","De la luz"],a:0},
  {t:"mc",q:"¿Qué parte de la planta la sostiene fija en el suelo y absorbe agua y nutrientes?",o:["La raíz","El tallo","La flor"],a:0},
  {t:"mc",q:"¿Qué parte ayuda a sostener la planta y transporta sustancias como los nutrientes y el agua?",o:["El tallo","La raíz","El fruto"],a:0},
  {t:"mc",q:"¿En qué parte de la planta se intercambian sustancias con el ambiente para respirar y elaborar el alimento?",o:["En las hojas","En la raíz","En el fruto"],a:0},
  {t:"mc",q:"¿Qué parte participa en la reproducción de las plantas?",o:["La flor","El tallo","La raíz"],a:0},
  {t:"mc",q:"¿Qué contienen los frutos?",o:["Las semillas","Las raíces","Las hojas"],a:0},
  {t:"mc",q:"¿Qué son las semillas?",o:["Las estructuras que permiten la reproducción en algunas plantas","Las partes que absorben agua","Las hojas jóvenes"],a:0},
  {t:"esc",q:"Parte de la planta que absorbe el agua del suelo",a:["raiz","raíz","la raiz"]},
  {t:"esc",q:"Parte de la planta donde se elabora el alimento y se respira",a:["hojas","las hojas","hoja"]},
  {t:"mc",q:"Los MUSGOS…",o:["solo tienen estructuras similares a raíces y hojas","tienen flores y frutos","tienen conos"],a:0},
  {t:"mc",q:"Los HELECHOS presentan raíces, tallos, hojas y…",o:["esporas en lugar de semillas","flores muy grandes","frutos carnosos"],a:0},
  {t:"mc",q:"Algunas plantas tienen raíces, tallos y hojas, pero en lugar de flores presentan…",o:["conos","esporas","frutos"],a:0,tip:"Como los pinos."},
  {t:"mc",q:"¿Todas las plantas tienen las mismas estructuras?",o:["No, hay plantas con flores y frutos, otras con conos y otras con esporas","Sí, todas son iguales","Solo cambian de color"],a:0},
  {t:"mc",q:"Una planta que presenta raíces, tallos, hojas, flores y frutos es, por ejemplo…",o:["la fresa","el musgo","el helecho"],a:0}
]}
];

/* ============ MOTOR ============ */
const $ = s => document.querySelector(s);
const state = { topic:null, list:[], i:0, wrong:[], answered:false, scores:{} };
const norm = s => s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[.,;!¡?¿"«»]/g,"").replace(/\s+/g," ");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function drawBoard(){
  const b=$("#board"); b.innerHTML="";
  T.forEach(t=>{
    const sc=state.scores[t.id]; const pct=sc?Math.round(sc.ok/sc.tot*100):0;
    const el=document.createElement("button");
    el.className="tile"; el.style.setProperty("--c",t.c);
    if(sc&&pct>=80) el.dataset.done="1";
    el.innerHTML=`<div><span class="em">${t.em}</span>
      <p class="tt">${t.name}</p><p class="pg">${t.pg}</p></div>
      <div><div class="bar"><i style="width:${pct}%"></i></div></div>
      ${sc?`<span class="score">${pct}</span>`:""}`;
    el.onclick=()=>start(t,t.q);
    b.appendChild(el);
  });
  const done=T.filter(t=>state.scores[t.id]&&state.scores[t.id].ok/state.scores[t.id].tot>=.8).length;
  $("#globalNote").textContent = done===0 ? "Todavía no hay temas dominados. Empieza por el que quieras."
    : done===T.length ? "¡Todos los temas dominados! Ahora sí: evaluación general."
    : `Temas dominados: ${done} de ${T.length}.`;
}

function start(topic,questions){
  state.topic=topic; state.list=shuffle(questions); state.i=0; state.wrong=[];
  $("#home").classList.add("hidden"); $("#result").classList.add("hidden");
  $("#quiz").classList.remove("hidden");
  $("#qtopic").textContent = topic ? `${topic.em} ${topic.name} · ${topic.pg}` : "🧪 Evaluación general · todos los temas";
  render();
}

function render(){
  state.answered=false;
  const q=state.list[state.i];
  $("#qtxt").textContent=q.q;
  $("#fb").className="fb"; $("#fb").innerHTML="";
  $("#nextRow").classList.add("hidden");
  $("#dots").innerHTML=state.list.map((_,k)=>`<i class="${k<state.i?(state.wrong.includes(state.list[k])?'no':'ok'):(k===state.i?'now':'')}"></i>`).join("");
  const box=$("#opts"); box.innerHTML="";
  if(q.t==="mc"){
    const opts=q._sh||(q._sh=shuffle(q.o.map((txt,idx)=>({txt,ok:idx===q.a}))));
    opts.forEach(o=>{
      const b=document.createElement("button");
      b.className="opt"; b.textContent=o.txt;
      b.onclick=()=>answer(o.ok,b,q,q.o[q.a]);
      box.appendChild(b);
    });
  }else{
    const div=document.createElement("div"); div.className="typebox";
    div.innerHTML=`<input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…">
      <button class="btn" id="btnCheck">Comprobar</button>`;
    box.appendChild(div);
    const go=()=>{
      const v=$("#inp").value; if(!v.trim())return;
      const ok=q.a.some(x=>norm(x)===norm(v));
      $("#inp").disabled=true; $("#btnCheck").disabled=true;
      answer(ok,null,q,q.a[0]);
    };
    $("#btnCheck").onclick=go;
    $("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    setTimeout(()=>$("#inp")&&$("#inp").focus(),50);
  }
}

const bravo=["¡Muy bien!","¡Correcto!","¡Perfecto!","¡Eso es!","¡Excelente!"];
function answer(ok,btn,q,right){
  if(state.answered)return; state.answered=true;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===right) b.classList.add("ok"); else b.classList.add("dim");
  });
  if(btn&&!ok){btn.classList.remove("dim");btn.classList.add("no","shake")}
  if(!ok) state.wrong.push(q);
  const fb=$("#fb");
  fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML=(ok?`<b>${bravo[Math.random()*bravo.length|0]}</b> `:`<b>Casi.</b> La respuesta es <b>${right}</b>. `)+(q.tip||"");
  $("#nextRow").classList.remove("hidden");
  $("#btnNext").textContent = state.i>=state.list.length-1 ? "Ver resultado →" : "Siguiente →";
  setTimeout(()=>$("#btnNext").focus(),60);
}

$("#btnNext").onclick=()=>{state.i++; state.i>=state.list.length?finish():render()};

function finish(){
  const tot=state.list.length, ok=tot-state.wrong.length, pct=Math.round(ok/tot*100);
  if(state.topic){
    const prev=state.scores[state.topic.id];
    if(!prev||ok/tot>prev.ok/prev.tot) state.scores[state.topic.id]={ok,tot};
  }
  $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden");
  const st=pct>=95?3:pct>=80?2:pct>=50?1:0;
  $("#rstars").textContent="★★★".slice(0,st).padEnd(3,"☆");
  $("#rscore").textContent=pct;
  $("#rmsg").textContent = pct===100?"Perfecto. Este tema ya está dominado."
    :pct>=80?"Muy bien. Repasa los fallos y queda listo."
    :pct>=50?"Vas bien, pero hay que repasar. Dale a «Repasar los fallos»."
    :"Este tema necesita otra vuelta. Repasa las páginas del libro y vuelve a intentarlo.";
  $("#btnRetryWrong").classList.toggle("hidden",state.wrong.length===0);
  drawBoard();
}

$("#btnRetryWrong").onclick=()=>start(state.topic,state.wrong.slice());
$("#btnHome").onclick=goHome; $("#btnBack").onclick=goHome;
function goHome(){
  $("#quiz").classList.add("hidden"); $("#result").classList.add("hidden");
  $("#home").classList.remove("hidden"); drawBoard(); window.scrollTo({top:0,behavior:"smooth"});
}
$("#btnFinal").onclick=()=>{
  const pool=[]; T.forEach(t=>shuffle(t.q).slice(0,4).forEach(q=>pool.push(q)));
  start(null,shuffle(pool).slice(0,20));
};
drawBoard();
</script>
